# Runs the whole suite on Windows, macOS and Linux.
#
# pytest already covers more than unit tests: the import-linter layering
# contracts (tests/test_layering.py), the three generator no-op checks that
# catch a stale manifest, limekit.lua or LSP stubs (tests/kernel/), and a
# headless boot of every 2.0 example app (tests/test_demo_smoke.py) -- which
# is why limekit-demos is checked out alongside.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the others' results: finding out
      # what breaks on macOS is half the reason this workflow exists.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.13 is what Limer ships (package_portable.py); test that everywhere.
        python: ["3.13"]
        include:
          # The oldest Python setup.py accepts.
          - os: ubuntu-latest
            python: "3.12"

    env:
      QT_QPA_PLATFORM: offscreen
      LIMEKIT_DEMOS: ${{ github.workspace }}/limekit-demos

    steps:
      - uses: actions/checkout@v7

      # The 2.0 examples live on the demos repo's migration branch until it
      # is merged; switch `ref` to master when it is.
      - uses: actions/checkout@v7
        with:
          repository: mitosisX/limekit-demos
          ref: limekit-2.0-migration
          path: limekit-demos

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt dlopens these even when rendering offscreen. The same list as
      # Limer's docker/Dockerfile.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0

      - name: Install Limekit
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest
